<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" role="img" aria-labelledby="title description">
  <title id="title">Model architecture outputs</title>
  <desc id="description">A 160-value processed state becomes 4,739 base scores. A learned candidate bonus is applied, producing one final raw logit for every possible guess.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.32" />
    </filter>
  </defs>

  <style>
    .box { fill: #1e293b; stroke: #475569; stroke-width: 2; filter: url(#shadow); }
    .blue-box { stroke: #38bdf8; }
    .purple-box { stroke: #a855f7; }
    .green-box { stroke: #34d399; }
    .label { fill: #f1f5f9; font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
    .small-label { fill: #f1f5f9; font: 650 17px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: middle; }
    .dimension { fill: #94a3b8; font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; }
    .word { fill: #f1f5f9; font: 700 19px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .score { fill: #34d399; font: 700 19px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: end; }
    .connection { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
    .soft { opacity: 0.8; stroke-width: 1.5; }
    .neuron { fill: #0f172a; stroke-width: 3; }
    .blue { stroke: #38bdf8; }
    .purple { stroke: #a855f7; }
    .green { stroke: #34d399; }
    .neutral { stroke: #cbd5e1; }
    .highlight { fill: #064e3b; stroke: #34d399; stroke-width: 2; }
    .dot { fill: #64748b; }
    .symbol { fill: #f1f5f9; font: 700 20px Inter, ui-sans-serif, system-ui, sans-serif; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Processed state -->
  <rect class="box blue-box" x="20" y="150" width="240" height="300" rx="22" />
  <text class="label" x="140" y="190">Processed state</text>
  <text class="dimension" x="140" y="218">160 values</text>
  <circle class="neuron blue" cx="85" cy="270" r="11" />
  <circle class="neuron blue" cx="140" cy="270" r="11" />
  <circle class="neuron blue" cx="195" cy="270" r="11" />
  <circle class="dot" cx="140" cy="315" r="3" />
  <circle class="dot" cx="140" cy="327" r="3" />
  <circle class="neuron blue" cx="85" cy="375" r="11" />
  <circle class="neuron blue" cx="140" cy="375" r="11" />
  <circle class="neuron blue" cx="195" cy="375" r="11" />

  <!-- Policy head -->
  <path class="connection" d="M 261 245 C 300 245, 300 150, 337 150" />
  <rect class="box green-box" x="350" y="20" width="430" height="310" rx="22" />
  <text class="label" x="565" y="58">Policy head</text>
  <text class="dimension" x="565" y="86">Dense 160 → 4,739 base logits</text>
  <path class="connection soft" d="M 430 145 L 694 125" />
  <path class="connection soft" d="M 430 145 L 694 185" />
  <path class="connection soft" d="M 430 205 L 694 125" />
  <path class="connection soft" d="M 430 205 L 694 245" />
  <path class="connection soft" d="M 430 265 L 694 185" />
  <path class="connection soft" d="M 430 265 L 694 285" />
  <circle class="neuron green" cx="415" cy="145" r="11" />
  <circle class="neuron green" cx="415" cy="205" r="11" />
  <circle class="neuron green" cx="415" cy="265" r="11" />
  <circle class="neuron green" cx="710" cy="125" r="10" />
  <circle class="neuron green" cx="710" cy="185" r="10" />
  <circle class="dot" cx="710" cy="214" r="3" />
  <circle class="dot" cx="710" cy="226" r="3" />
  <circle class="neuron green" cx="710" cy="255" r="10" />
  <circle class="neuron green" cx="710" cy="285" r="10" />

  <!-- Candidate bonus -->
  <path class="connection" d="M 261 365 C 300 365, 300 455, 337 455" />
  <rect class="box purple-box" x="350" y="370" width="430" height="210" rx="22" />
  <text class="label" x="565" y="408">Candidate bonus</text>
  <text class="dimension" x="565" y="436">Dense 160 → β</text>
  <circle class="neuron purple" cx="415" cy="485" r="10" />
  <circle class="neuron purple" cx="415" cy="530" r="10" />
  <path class="connection soft" d="M 427 485 L 682 507" />
  <path class="connection soft" d="M 427 530 L 682 507" />
  <circle class="neuron purple" cx="705" cy="507" r="20" />
  <text class="symbol" x="705" y="507">β</text>

  <!-- Combine base scores and bonus -->
  <circle class="neuron purple" cx="885" cy="455" r="23" />
  <text class="symbol" x="885" y="455">×</text>
  <rect class="box blue-box" x="800" y="510" width="210" height="75" rx="17" />
  <text class="small-label" x="905" y="542">Remaining candidates</text>
  <text class="dimension" x="905" y="567">4,739-value mask</text>
  <path class="connection" d="M 726 507 C 800 507, 810 455, 861 455" />
  <path class="connection" d="M 905 510 L 895 480" />

  <circle class="neuron green" cx="945" cy="240" r="23" />
  <text class="symbol" x="945" y="240">+</text>
  <path class="connection" d="M 723 185 C 845 185, 845 240, 920 240" />
  <path class="connection" d="M 885 431 C 885 340, 945 340, 945 265" />

  <!-- Example final logits -->
  <path class="connection" d="M 970 240 L 1037 240" />
  <rect class="box green-box" x="1050" y="35" width="430" height="530" rx="24" />
  <text class="label" x="1265" y="76">Final logits</text>
  <text class="dimension" x="1265" y="104">4,739 raw scores · example</text>

  <rect class="highlight" x="1090" y="135" width="350" height="66" rx="14" />
  <circle class="neuron green" cx="1122" cy="168" r="10" />
  <text class="word" x="1150" y="175">RAISE</text>
  <text class="score" x="1400" y="175">8.4</text>

  <rect x="1090" y="217" width="350" height="66" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <circle class="neuron neutral" cx="1122" cy="250" r="10" />
  <text class="word" x="1150" y="257">SLATE</text>
  <text class="score" x="1400" y="257">7.1</text>

  <rect x="1090" y="299" width="350" height="66" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <circle class="neuron neutral" cx="1122" cy="332" r="10" />
  <text class="word" x="1150" y="339">CHANT</text>
  <text class="score" x="1400" y="339">5.9</text>

  <circle class="dot" cx="1265" cy="401" r="3" />
  <circle class="dot" cx="1265" cy="414" r="3" />
  <circle class="dot" cx="1265" cy="427" r="3" />

  <rect x="1090" y="462" width="350" height="66" rx="14" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <circle class="neuron neutral" cx="1122" cy="495" r="10" />
  <text class="word" x="1150" y="502">ZYMIC</text>
  <text class="score" x="1400" y="502">−3.2</text>

  <!-- Three simple facts -->
  <rect class="box blue-box" x="1530" y="70" width="240" height="125" rx="20" />
  <text class="small-label" x="1650" y="112">One per guess</text>
  <text class="dimension" x="1650" y="150">4,739 scores</text>

  <rect class="box green-box" x="1530" y="238" width="240" height="125" rx="20" />
  <text class="small-label" x="1650" y="280">Higher is preferred</text>
  <text class="dimension" x="1650" y="318">relative ranking</text>

  <rect class="box purple-box" x="1530" y="406" width="240" height="125" rx="20" />
  <text class="small-label" x="1650" y="448">Not probabilities</text>
  <text class="dimension" x="1650" y="486">raw scores</text>
</svg>
